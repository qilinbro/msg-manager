        "description": "仅人工专用表单，不生成Agent可执行schema；严格区分大小写、拒绝重复/未知/null/错类型/尾随JSON，整个本机请求最多8192字节。expected_revision初始1。retain_secret=true仅允许AppID保持不变、app_secret为空且已存密钥；不读回秘密。本人重新输入同应用open_id并明确确认；配置变更（含同值保存）撤销周期授权，旧报告不可借换目标重发。SQLCipher中加密保存，不放浏览器持久存储或对话。"
