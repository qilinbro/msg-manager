              "required": [
                "retain_secret"
              ]
            },
            "then": {
              "properties": {
                "app_secret": {
                  "const": ""
                }
              }
            },
            "else": {
              "properties": {
                "app_secret": {
                  "minLength": 1
                }
              }
            }
          }
