          },
          "read_only": {
            "type": "boolean",
            "const": true,
            "description": "后台接收不发送任何平台消息"
          },
          "last_error": {
            "type": "string",
            "description": "最近一次固定错误分类"
          }
        }
      },
      "MilkyStatus": {
        "type": "object",
        "required": [
          "configured",
          "state",
          "account_id",
          "nickname",
          "milky_version",
          "checked_at",
          "receiving_enabled",
          "sending_enabled",
          "read_only",
          "last_sync_at",
          "last_sync_result",
          "skipped",
          "gaps",
          "monitor"
        ],
        "properties": {
          "configured": {
            "type": "boolean",
            "description": "后台是否已配置协议端"
          },
          "state": {
            "type": "string"
          },
          "account_id": {
            "type": "string",
            "description": "后台配置的预期 QQ 号"
          },
          "nickname": {
            "type": "string",
            "description": "最近一次核验返回的昵称"
          },
          "milky_version": {
            "type": "string",
            "description": "锁定的 Milky 协议版本"
          },
          "checked_at": {
            "type": "string",
            "description": "最近一次成功核验时间；空表示尚未核验"
          },
          "receiving_enabled": {
            "type": "boolean",
            "description": "是否显式开启后台接收"
          },
          "sending_enabled": {
            "type": "boolean",
            "const": false,
            "description": "平台发送保持关闭"
          },
          "read_only": {
            "type": "boolean",
            "const": true,
            "description": "连接器只读"
          },
          "last_sync_at": {
            "type": "string",
            "description": "最近一次历史同步时间"
          },
          "last_sync_result": {
            "type": "string",
            "description": "最近一次历史同步结果"
          },
          "skipped": {
            "type": "integer",
            "description": "累计跳过的非文本或不支持消息数"
          },
          "gaps": {
            "type": "array",
            "description": "最近的断线/跳过缺口记录",
            "items": {
              "type": "object",
              "properties": {
                "at": {
                  "type": "integer"
                },
                "reason": {
                  "type": "string"
                }
              }
            }
          },
          "monitor": {
            "$ref": "#/components/schemas/MilkyMonitor"
          }
        }
      },
      "MilkySyncRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "peer_id"
        ],
        "properties": {
          "peer_id": {
            "type": "string",
            "pattern": "^[1-9][0-9]*$",
            "description": "明确选定的好友 QQ 号"
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 30,
            "description": "本页条数，默认 20"
          }
        }
      },
      "MilkyMonitorRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "enabled",
          "peer_ids"
        ],
        "properties": {
          "enabled": {
            "type": "boolean",
            "description": "是否开启后台接收"
          },
          "peer_ids": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "type": "string",
              "pattern": "^[1-9][0-9]*$"
            }
          }
        }
      },
      "MilkySyncResult": {
        "type": "object",
        "required": [
          "inserted",
          "duplicates",
          "conversations",
          "skipped",
          "next_cursor",
          "source_kind",
          "sending_enabled"
        ],
        "properties": {
          "inserted": {
            "type": "integer"
          },
          "duplicates": {
            "type": "integer"
          },
          "conversations": {
            "type": "integer"
          },
          "skipped": {
            "type": "integer"
          },
          "next_cursor": {
            "type": [
              "integer",
              "null"
            ]
          },
          "source_kind": {
            "type": "string",
            "const": "protocol_sync"
          },
          "sending_enabled": {
            "type": "boolean",
            "const": false,
            "description": "平台发送保持关闭"
          }
        }
      },
      "ImportAIConsent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "confirmed",
          "model_config_id"
        ],
        "properties": {
          "confirmed": {
            "type": "boolean",
            "const": true
          },
          "model_config_id": {
            "type": "string",
            "maxLength": 64,
            "minLength": 64
          }
        }
      },
      "ModelConfig": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "base_url",
          "model",
          "daily_limit",
          "key_configured",
          "revision",
          "configured",
          "model_config_id",
          "sending_enabled"
        ],
        "properties": {
          "base_url": {
            "type": "string",
            "maxLength": 2048
          },
          "model": {
            "type": "string",
            "maxLength": 128
          },
          "daily_limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1000
          },
          "key_configured": {
            "type": "boolean"
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "configured": {
            "type": "boolean"
          },
          "model_config_id": {
            "type": "string",
            "maxLength": 64
          },
          "sending_enabled": {
            "type": "boolean",
            "const": false
          }
        }
      },
      "ModelConfigSave": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expected_revision",
          "base_url",
          "model",
          "daily_limit",
          "api_key",
          "confirmed"
        ],
        "properties": {
          "expected_revision": {
            "type": "integer",
            "minimum": 0
          },
          "base_url": {
            "type": "string",
            "maxLength": 2048
          },
          "model": {
            "type": "string",
            "maxLength": 128
          },
          "daily_limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1000
          },
          "api_key": {
            "type": "string",
            "maxLength": 4096,
            "writeOnly": true,
            "description": "仅提交到本机后台并加密保存；空值保留旧密钥，换地址必须重填。"
          },
          "confirmed": {
            "type": "boolean",
            "const": true
          }
        }
      },
      "ProfileLinkIdentity": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "conversation_id",
          "display_name",
          "platform",
          "peer_id",
          "reason"
        ],
        "properties": {
          "conversation_id": {
            "type": "string",
            "maxLength": 128
          },
          "display_name": {
            "type": "string",
            "maxLength": 512
          },
          "platform": {
            "type": "string",
            "maxLength": 32
          },
          "peer_id": {
            "type": "string",
            "maxLength": 128
          },
          "reason": {
            "type": "string",
            "enum": [
              "confirmed",
              "same_public_name",
              "same_nickname",
              "same_platform_id"
            ]
          }
        }
      },
      "ProfileLinks": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "conversation_id",
          "candidates",
          "linked",
          "document_markdown",
          "truncated"
        ],
        "properties": {
          "conversation_id": {
            "type": "string",
            "maxLength": 128
          },
          "candidates": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ProfileLinkIdentity"
            },
            "maxItems": 20
          },
          "linked": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ProfileLinkIdentity"
            },
            "maxItems": 20
          },
          "document_markdown": {
            "type": "string",
            "maxLength": 180000
          },
          "truncated": {
            "type": "boolean"
          }
        }
      },
      "ProfileLinkConfirmation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "target_conversation_id",
          "confirmed"
        ],
        "properties": {
          "target_conversation_id": {
            "type": "string",
            "maxLength": 128
          },
          "confirmed": {
            "type": "boolean",
            "const": true
          }
        }
      },
      "DigestSchedule": {
        "type": "object",
        "required": [
          "enabled",
          "local_time",
          "timezone",
          "revision",
          "last_run_day"
        ],
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "local_time": {
            "type": "string",
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$"
          },
          "timezone": {
            "type": "string",
            "const": "Asia/Shanghai"
          },
          "revision": {
            "type": "integer"
          },
          "last_run_day": {
            "type": "string"
          }
        }
      },
      "DigestScheduleSave": {
        "type": "object",
        "required": [
          "enabled",
          "local_time",
          "timezone",
          "expected_revision",
          "confirmed"
        ],
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "local_time": {
            "type": "string"
          },
          "timezone": {
            "type": "string",
            "const": "Asia/Shanghai"
          },
          "expected_revision": {
            "type": "integer"
          },
          "confirmed": {
            "type": "boolean",
            "const": true
          }
        }
      },
      "DigestReminder": {
        "type": "object",
        "required": [
          "conversation_id",
          "title",
          "platform",
          "priority",
          "reason",
          "evidence_ids"
        ],
        "properties": {
          "conversation_id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "platform": {
            "type": "string"
          },
          "conversation_kind": {
            "type": "string",
            "enum": [
              "private",
              "group"
            ]
          },
          "priority": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          },
          "evidence_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "DigestReport": {
        "type": "object",
        "required": [
          "id",
          "day",
          "state",
          "summary",
          "reminders",
          "evidence_ids",
          "conversation_count",
          "generated_at"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "day": {
            "type": "string"
          },
          "state": {
            "type": "string"
          },
          "summary": {
            "type": "string"
          },
          "reminders": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/DigestReminder"
            }
          },
          "evidence_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "conversation_count": {
            "type": "integer"
          },
          "generated_at": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "DigestLatest": {
        "type": "object",
        "required": [
          "report"
        ],
        "properties": {
          "report": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/DigestReport"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      }
    }
  }
}
