  "components": {
    "securitySchemes": {
      "localBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Random local pairing token, at least 32 characters; provided by SOCIALD_API_TOKEN."
      }
    },
    "schemas": {
      "PlannedEvent": {
        "type": "object",
        "description": "Design-only notification payload. No endpoint emits this schema yet. Events will reference resources instead of including chat bodies or credentials.",
        "required": [
          "id",
          "type",
          "occurred_at",
          "workspace_id",
          "resource_id",
          "resource_version"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "description": "Future persistent event cursor, assigned by the server."
          },
          "type": {
            "type": "string",
            "enum": [
              "message.updated",
              "connection.updated",
              "approval.updated",
              "job.updated",
              "report.updated"
            ]
          },
          "occurred_at": {
            "type": "string",
            "format": "date-time"
          },
          "workspace_id": {
            "type": "string"
          },
          "resource_id": {
            "type": "string"
          },
          "resource_version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message",
              "trace_id"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "trace_id": {
                "type": "string"
              }
            }
          }
        }
      },
      "Capabilities": {
        "type": "object",
        "required": [
          "receive_text",
          "send_text",
          "history_import"
        ],
        "properties": {
          "receive_text": {
            "type": "boolean",
            "description": "当前仅已配置邮箱且加密存储可用时提供手动只读收取；不表示持续监听。"
          },
          "send_text": {
            "type": "boolean",
            "const": false
          },
          "history_import": {
            "type": "boolean",
            "const": false
          }
        }
      },
      "Connector": {
        "type": "object",
        "required": [
          "id",
          "display_name",
          "platform",
          "status",
          "implementation_status",
          "capabilities",
          "description"
        ],
        "properties": {
          "id": {
            "type": "string",
            "enum": [
              "qq-onebot",
              "weixin-clawbot",
              "telegram-bot"
            ]
          },
          "display_name": {
            "type": "string"
          },
          "platform": {
            "type": "string",
            "enum": [
              "qq",
              "weixin",
              "telegram",
              "email"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "not_configured",
              "configured",
              "identity_verified",
              "unreachable",
              "auth_failed",
              "identity_mismatch",
              "logged_out",
              "protocol_error"
            ]
          },
          "implementation_status": {
            "type": "string",
            "enum": [
              "planned",
              "probe_ready",
              "manual_sync_ready"
            ]
          },
          "capabilities": {
            "$ref": "#/components/schemas/Capabilities"
          },
          "description": {
            "type": "string"
          }
        }
      },
      "System": {
        "type": "object",
        "required": [
          "version",
          "stage",
          "workspace_id",
          "automation",
          "storage",
          "connectors"
        ],
        "properties": {
          "version": {
            "type": "string"
          },
          "stage": {
            "type": "string",
            "enum": [
              "scaffold",
              "unified_inbox"
            ]
          },
          "workspace_id": {
            "type": "string",
            "const": "local-default"
          },
          "automation": {
            "type": "object",
            "required": [
              "paused",
              "auto_send_enabled"
            ],
            "properties": {
              "paused": {
                "type": "boolean",
                "const": true
              },
              "auto_send_enabled": {
                "type": "boolean",
                "const": false
              }
            }
          },
          "storage": {
            "type": "object",
            "required": [
              "configured",
              "driver"
            ],
            "properties": {
              "configured": {
                "type": "boolean"
              },
              "driver": {
                "type": "string",
                "enum": [
                  "sqlite",
                  "sqlcipher"
                ]
              }
            }
          },
          "connectors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Connector"
            }
          }
        }
      },
      "EmptyList": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 0,
            "items": {
              "type": "object"
            }
          },
          "next_cursor": {
            "type": "null"
          }
        }
      },
      "ConnectorList": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Connector"
            }
          },
          "next_cursor": {
            "type": "null"
          }
        },
        "description": "One personal QQ adapter with identity verification plus planned Weixin/Telegram adapters. Identity verification never enables messaging."
      },
      "OutboxState": {
        "type": "string",
        "enum": [
          "pending",
          "sending",
          "sent",
          "retry_wait",
          "failed",
          "unknown",
          "cancelled"
        ],
        "description": "Reserved domain state; no outbox persistence or send operation is implemented."
      },
      "QQVerification": {
        "type": "object",
        "required": [
          "connection_id",
          "state",
          "account_id",
          "nickname",
          "online",
          "checked_at",
          "receiving_enabled",
          "sending_enabled"
        ],
        "properties": {
          "connection_id": {
            "type": "string",
            "const": "qq-onebot"
          },
          "state": {
            "type": "string",
            "const": "identity_verified"
          },
          "account_id": {
            "type": "string",
            "pattern": "^[1-9][0-9]*$"
          },
          "nickname": {
            "type": "string"
          },
          "online": {
            "type": "boolean",
            "const": true
          },
          "checked_at": {
            "type": "string",
            "format": "date-time"
          },
          "receiving_enabled": {
            "type": "boolean",
            "const": false
          },
          "sending_enabled": {
            "type": "boolean",
            "const": false
          }
        }
      },
      "InboxStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "storage_enabled",
          "source_mode",
          "platforms",
          "import_limit"
        ],
        "properties": {
          "storage_enabled": {
            "type": "boolean"
          },
          "source_mode": {
            "type": "string",
            "enum": [
              "import",
              "mixed"
            ]
          },
          "platforms": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "id",
                "name",
                "live_status",
                "message_count"
              ],
              "properties": {
                "id": {
                  "type": "string",
                  "enum": [
                    "qq",
                    "weixin",
                    "telegram",
                    "shanliao",
                    "email"
                  ]
                },
                "name": {
                  "type": "string"
                },
                "live_status": {
                  "type": "string",
                  "enum": [
                    "not_connected",
                    "probe_only",
                    "unsupported",
                    "configured"
                  ]
                },
                "message_count": {
                  "type": "integer",
                  "minimum": 0
                }
              }
            }
          },
          "import_limit": {
            "type": "integer",
            "const": 1000
          }
        }
      },
      "InboxConnection": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "platform",
          "account_id",
          "display_name",
          "source",
          "message_count"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "platform": {
            "type": "string",
            "enum": [
              "qq",
              "weixin",
              "telegram",
              "shanliao",
              "email"
            ]
          },
          "account_id": {
            "type": "string"
          },
          "display_name": {
            "type": "string"
          },
          "source": {
            "type": "string",
            "enum": [
              "import",
              "imap",
              "mixed"
            ]
          },
          "message_count": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Conversation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "connection_id",
          "platform",
          "account_id",
          "peer_id",
          "title",
          "last_message",
          "last_message_at",
          "unread_count",
          "pinned",
          "archived"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "connection_id": {
            "type": "string"
          },
          "platform": {
            "type": "string",
            "enum": [
              "qq",
              "weixin",
              "telegram",
              "shanliao",
              "email"
            ]
          },
          "account_id": {
            "type": "string"
          },
          "peer_id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "last_message": {
            "type": "string"
          },
          "last_message_at": {
            "type": "string",
            "format": "date-time"
          },
          "unread_count": {
            "type": "integer",
            "minimum": 0
          },
          "pinned": {
            "type": "boolean"
          },
          "archived": {
            "type": "boolean"
          },
          "account_name": {
            "type": "string"
          }
        }
      },
      "InboxMessage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "conversation_id",
          "external_id",
          "direction",
          "body",
          "occurred_at",
          "read",
          "source"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "conversation_id": {
            "type": "string"
          },
          "external_id": {
            "type": "string"
          },
          "direction": {
            "type": "string",
            "enum": [
              "incoming",
              "outgoing"
            ]
          },
          "body": {
            "type": "string"
          },
          "occurred_at": {
            "type": "string",
            "format": "date-time"
          },
          "read": {
            "type": "boolean"
          },
          "source": {
            "type": "string",
            "enum": [
              "import",
              "imap"
            ]
          },
          "email": {
            "$ref": "#/components/schemas/EmailHeaders"
          }
        }
      },
      "ImportMessage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "external_id",
          "peer_id",
          "peer_name",
          "direction",
          "body",
          "occurred_at"
        ],
        "properties": {
          "external_id": {
            "type": "string",
            "maxLength": 128,
            "minLength": 1
          },
          "peer_id": {
            "type": "string",
            "maxLength": 128,
            "minLength": 1
          },
          "peer_name": {
            "type": "string",
            "maxLength": 128,
            "minLength": 1
          },
          "direction": {
            "type": "string",
            "enum": [
              "incoming",
              "outgoing"
            ]
          },
          "body": {
            "type": "string",
            "minLength": 1,
            "maxLength": 16000,
            "description": "最多16000 UTF-8字节"
          },
          "occurred_at": {
            "type": "string",
            "format": "date-time"
          },
          "email": {
            "$ref": "#/components/schemas/EmailHeaders"
          },
          "read": {
            "type": "boolean"
          }
        }
      },
      "MessageImport": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "platform",
          "account_id",
          "account_name",
          "messages"
        ],
        "properties": {
          "platform": {
            "type": "string",
            "enum": [
              "qq",
              "weixin",
              "telegram",
              "shanliao",
              "email"
            ]
          },
          "account_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "account_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ImportMessage"
            },
            "minItems": 1,
            "maxItems": 1000
          }
        }
      },
      "TelegramImport": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "account_id",
          "account_name",
          "export"
        ],
        "properties": {
          "account_id": {
            "type": "string",
            "pattern": "^[1-9][0-9]*$"
          },
          "account_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "export": {
            "type": "object",
            "description": "Telegram Desktop导出的单个personal_chat JSON对象；不支持全账号/群聊导出"
          }
        }
      },
      "ImportResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "inserted",
          "duplicates",
          "conversations"
        ],
        "properties": {
          "inserted": {
            "type": "integer",
            "minimum": 0
          },
          "duplicates": {
            "type": "integer",
            "minimum": 0
          },
          "conversations": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "TelegramImportResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "inserted",
          "duplicates",
          "conversations",
          "skipped"
        ],
        "properties": {
          "inserted": {
            "type": "integer",
            "minimum": 0
          },
          "duplicates": {
            "type": "integer",
            "minimum": 0
          },
          "conversations": {
            "type": "integer",
            "minimum": 0
          },
          "skipped": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "ConversationPatch": {
        "type": "object",
        "additionalProperties": false,
        "minProperties": 1,
        "properties": {
          "read": {
            "type": "boolean"
          },
          "pinned": {
            "type": "boolean"
          },
          "archived": {
            "type": "boolean"
          }
        }
      },
      "InboxMutationResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "ok"
        ],
        "properties": {
          "ok": {
            "type": "boolean",
            "const": true
          }
        }
      },
      "ConversationList": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Conversation"
            }
          },
          "next_cursor": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "InboxMessageList": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/InboxMessage"
            }
          },
          "next_cursor": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "InboxConnectionList": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/InboxConnection"
            }
          },
          "next_cursor": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "EmailHeaders": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "subject",
          "from_name",
          "from_address",
          "to",
          "folder"
        ],
        "properties": {
          "subject": {
            "type": "string"
          },
          "from_name": {
            "type": "string"
          },
          "from_address": {
            "type": "string"
          },
          "to": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "folder": {
            "type": "string"
          }
        }
      },
      "EmailSyncResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "inserted",
          "duplicates",
          "conversations",
          "skipped",
          "limited",
          "synced_at",
          "sending_enabled"
        ],
        "properties": {
          "inserted": {
            "type": "integer",
            "minimum": 0
          },
          "duplicates": {
            "type": "integer",
            "minimum": 0
          },
          "conversations": {
            "type": "integer",
            "minimum": 0
          },
          "skipped": {
            "type": "integer",
            "minimum": 0
          },
          "limited": {
            "type": "boolean"
          },
          "synced_at": {
            "type": "string",
            "format": "date-time"
          },
          "sending_enabled": {
            "type": "boolean",
            "const": false
          }
        }
      },
      "EmailStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "configured",
          "state",
          "account",
          "folder",
          "last_synced_at",
          "last_result",
          "sending_enabled"
        ],
        "properties": {
          "configured": {
            "type": "boolean"
          },
          "state": {
            "type": "string",
            "enum": [
              "not_configured",
              "ready",
              "syncing",
              "synced",
              "auth_failed",
              "unreachable",
              "protocol_error"
            ]
          },
          "account": {
            "type": [
              "string",
              "null"
            ]
          },
          "folder": {
            "type": [
              "string",
              "null"
            ]
          },
          "last_synced_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "last_result": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/EmailSyncResult"
              },
              {
                "type": "null"
              }
            ]
          },
          "sending_enabled": {
            "type": "boolean",
            "const": false
          }
        }
      }
    }
  }
}
