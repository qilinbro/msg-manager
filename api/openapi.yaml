    "title": "Social Intelligence OS — scaffold API",
    "version": "0.1.0",
    "description": "本机 Bearer API：加密消息管理、只读微信本地库读取、IMAP 手动同步、QQ 身份核验和用户确认后发起的会话 AI 分析。模型只生成本地建议，不开放平台发送。后台实时接收、任务队列、审批、发送和 SSE 仍待实现。JSON 语法是有效的 YAML 1.2；预检仅放行明确来源和方法，实际业务请求始终鉴权。"
  },
