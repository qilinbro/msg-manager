    "/api/v1/conversations": {
      "get": {
        "description": "按平台、关键字和未读状态检索会话；默认未归档，置顶优先。",
        "x-implementation-status": "implemented",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
