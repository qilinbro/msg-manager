    "/api/v1/connections/qq-onebot/verify": {
      "get": {
        "operationId": "verifyQQAccount",
        "summary": "Verify the existing personal QQ login through configured OneBot v11.",
        "description": "Read-only diagnostic. Endpoint and credentials come exclusively from local backend environment; request parameters cannot select a provider. A successful check is a past observation, not a live account subscription. Auto-send and message ingestion remain disabled.",
        "responses": {
          "200": {
            "description": "Identity and online state verified.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QQVerification"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid product API bearer token.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Host, Origin, or workspace rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "QQ_NOT_CONFIGURED, QQ_UNREACHABLE, QQ_AUTH_FAILED, QQ_IDENTITY_MISMATCH, QQ_LOGGED_OUT, QQ_PROTOCOL_ERROR or QQ_BUSY.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
