  "components": {
    "securitySchemes": {
      "localBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Random local pairing token, at least 32 characters; provided by SOCIALD_API_TOKEN."
      }
    },
    "schemas": {
      "PlannedEvent": {
        "type": "object",
        "description": "Design-only notification payload. No endpoint emits this schema yet. Events will reference resources instead of including chat bodies or credentials.",
        "required": [
          "id",
          "type",
          "occurred_at",
          "workspace_id",
          "resource_id",
          "resource_version"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "description": "Future persistent event cursor, assigned by the server."
          },
          "type": {
            "type": "string",
            "enum": [
              "message.updated",
              "connection.updated",
              "approval.updated",
              "job.updated",
              "report.updated"
            ]
          },
          "occurred_at": {
            "type": "string",
            "format": "date-time"
          },
          "workspace_id": {
            "type": "string"
          },
          "resource_id": {
            "type": "string"
          },
          "resource_version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message",
              "trace_id"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "trace_id": {
                "type": "string"
              }
            }
          }
        }
      },
      "Capabilities": {
        "type": "object",
        "required": [
          "receive_text",
          "send_text",
          "history_import"
        ],
        "properties": {
          "receive_text": {
            "type": "boolean",
            "const": false
          },
          "send_text": {
            "type": "boolean",
            "const": false
          },
          "history_import": {
            "type": "boolean",
            "const": false
          }
        }
      },
      "Connector": {
        "type": "object",
        "required": [
          "id",
          "display_name",
          "platform",
          "status",
          "implementation_status",
          "capabilities",
          "description"
        ],
        "properties": {
          "id": {
            "type": "string",
            "enum": [
              "qq-onebot",
              "weixin-clawbot",
              "telegram-bot"
            ]
          },
          "display_name": {
            "type": "string"
          },
          "platform": {
            "type": "string",
            "enum": [
              "qq",
              "weixin",
              "telegram"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "not_configured",
              "configured",
              "identity_verified",
              "unreachable",
              "auth_failed",
              "identity_mismatch",
              "logged_out",
              "protocol_error"
            ]
          },
          "implementation_status": {
            "type": "string",
            "enum": [
              "planned",
              "probe_ready"
            ]
          },
          "capabilities": {
            "$ref": "#/components/schemas/Capabilities"
          },
          "description": {
            "type": "string"
          }
        }
      },
      "System": {
        "type": "object",
        "required": [
          "version",
          "stage",
          "workspace_id",
          "automation",
          "storage",
          "connectors"
        ],
        "properties": {
          "version": {
            "type": "string"
          },
          "stage": {
            "type": "string",
            "const": "scaffold"
          },
          "workspace_id": {
            "type": "string",
            "const": "local-default"
          },
          "automation": {
            "type": "object",
            "required": [
              "paused",
              "auto_send_enabled"
            ],
            "properties": {
              "paused": {
                "type": "boolean",
                "const": true
              },
              "auto_send_enabled": {
                "type": "boolean",
                "const": false
              }
            }
          },
          "storage": {
            "type": "object",
            "required": [
              "configured",
              "driver"
            ],
            "properties": {
              "configured": {
                "type": "boolean",
                "const": false
              },
              "driver": {
                "type": "string",
                "const": "sqlite"
              }
            }
          },
          "connectors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Connector"
            }
          }
        }
      },
      "EmptyList": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 0,
            "items": {
              "type": "object"
            }
          },
          "next_cursor": {
            "type": "null"
          }
        }
      },
      "ConnectorList": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Connector"
            }
          },
          "next_cursor": {
            "type": "null"
          }
        },
        "description": "One personal QQ adapter with identity verification plus planned Weixin/Telegram adapters. Identity verification never enables messaging."
      },
      "OutboxState": {
        "type": "string",
        "enum": [
          "pending",
          "sending",
          "sent",
          "retry_wait",
          "failed",
          "unknown",
          "cancelled"
        ],
        "description": "Reserved domain state; no outbox persistence or send operation is implemented."
      },
      "QQVerification": {
        "type": "object",
        "required": [
          "connection_id",
          "state",
          "account_id",
          "nickname",
          "online",
          "checked_at",
          "receiving_enabled",
          "sending_enabled"
        ],
        "properties": {
          "connection_id": {
            "type": "string",
            "const": "qq-onebot"
          },
          "state": {
            "type": "string",
            "const": "identity_verified"
          },
          "account_id": {
            "type": "string",
            "pattern": "^[1-9][0-9]*$"
          },
          "nickname": {
            "type": "string"
          },
          "online": {
            "type": "boolean",
            "const": true
          },
          "checked_at": {
            "type": "string",
            "format": "date-time"
          },
          "receiving_enabled": {
            "type": "boolean",
            "const": false
          },
          "sending_enabled": {
            "type": "boolean",
            "const": false
          }
        }
      }
    }
  }
}
