  "components": {
    "securitySchemes": {
      "localBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Random local pairing token, at least 32 characters; provided by SOCIALD_API_TOKEN."
      }
    },
    "schemas": {
      "PlannedEvent": {
        "type": "object",
        "description": "Design-only notification payload. No endpoint emits this schema yet. Events will reference resources instead of including chat bodies or credentials.",
        "required": [
          "id",
          "type",
          "occurred_at",
          "workspace_id",
          "resource_id",
          "resource_version"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "description": "Future persistent event cursor, assigned by the server."
          },
          "type": {
            "type": "string",
            "enum": [
              "message.updated",
              "connection.updated",
              "approval.updated",
              "job.updated",
              "report.updated"
            ]
          },
          "occurred_at": {
            "type": "string",
            "format": "date-time"
          },
          "workspace_id": {
            "type": "string"
          },
          "resource_id": {
            "type": "string"
          },
          "resource_version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message",
              "trace_id"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "trace_id": {
                "type": "string"
              }
            }
          }
        }
      },
      "Capabilities": {
        "type": "object",
        "required": [
          "receive_text",
          "send_text",
          "history_import"
        ],
        "properties": {
          "receive_text": {
            "type": "boolean",
            "description": "当前仅已配置邮箱且加密存储可用时提供手动只读收取；不表示持续监听。"
          },
          "send_text": {
            "type": "boolean",
            "const": false
          },
          "history_import": {
            "type": "boolean",
            "const": false
          }
        }
      },
      "Connector": {
        "type": "object",
        "required": [
          "id",
          "display_name",
          "platform",
          "status",
          "implementation_status",
          "capabilities",
          "description"
        ],
        "properties": {
          "id": {
            "type": "string",
            "enum": [
              "qq-onebot",
              "weixin-clawbot",
              "telegram-bot",
              "qq-milky"
            ]
          },
          "display_name": {
            "type": "string"
          },
          "platform": {
            "type": "string",
            "enum": [
              "qq",
              "weixin",
              "telegram",
              "email"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "not_configured",
              "configured",
              "identity_verified",
              "unreachable",
              "auth_failed",
              "identity_mismatch",
              "logged_out",
              "protocol_error",
              "version_mismatch",
              "invalid_config"
            ]
          },
          "implementation_status": {
            "type": "string",
            "enum": [
              "planned",
              "probe_ready",
              "manual_sync_ready"
            ]
          },
          "capabilities": {
            "$ref": "#/components/schemas/Capabilities"
          },
          "description": {
            "type": "string"
          }
