      "get": {
        "operationId": "getLiveness",
        "summary": "HTTP process liveness, not product readiness.",
        "security": [],
        "responses": {
          "200": {
            "description": "Process running. Response contains no credentials."
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "operationId": "getReadiness",
