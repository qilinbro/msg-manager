{
  "openapi": "3.1.0",
  "info": {
    "title": "Social Intelligence OS — scaffold API",
    "version": "0.1.0",
    "description": "T04 initial contract. API resources are not persisted; no real connector or mutation is implemented. OPTIONS preflight without credentials is allowed only for approved local origins and methods, contains no business data, and does not bypass authentication of actual requests. This file uses JSON syntax, which is valid YAML 1.2. QQ personal-account adapter: the authenticated verification endpoint only checks the operator-configured local OneBot service; no continuous reception, persistence, or sending is enabled."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:17890"
    }
  ],
  "security": [
    {
      "localBearer": []
    }
  ],
