{
  "openapi": "3.1.0",
  "info": {
    "title": "Social Intelligence OS — local business and Assistant API",
    "version": "0.1.0",
    "description": "本机 Bearer/可撤销设备授权 API：加密消息管理、只读平台同步与监控、人工同意的 AI/档案/摘要，以及原生工具调用 Assistant。Assistant 覆盖已实现业务 API 并复用原处理器，所有变更逐项确认；认证生命周期、模型与飞书凭据配置仍仅人工。共享持久化额度、模型标识与版本绑定、暂停会话数据隔离始终生效。通用任务/审批/会话发送/SSE等占位不可执行；新增默认关闭的飞书本人私聊早晚报，固定上海08:00/20:00，独立同意后才可外发冻结摘要，不开放任意收件人或文本。JSON 语法是有效 YAML 1.2，实际业务请求始终鉴权。 Telegram Bot API现支持真实NoneBot适配器的人工核验与逐次同意的授权私聊文本单页接收；不支持个人账号历史/后台轮询/发送/自动AI，已有webhook拒绝且不删除。飞书默认NoneBot，legacy-go仅显式兼容选择。"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:17890"
    }
  ],
  "security": [
    {
      "localBearer": []
    }
  ],
  "paths": {
    "/api/v1/auth/devices": {
      "post": {
        "operationId": "pairLocalDevice",
        "summary": "Pair a trusted browser using the master bearer, never a device bearer.",
        "description": "Exact trusted non-null Origin required. JSON is at most 4096 bytes, exact case-sensitive fields, no duplicates or extra values. Stores only a public P-256 SPKI and bound metadata in SQLCipher. Grant lasts at most 90 days; at most 32 active grants. No cookie or master token is returned.",
        "x-master-only": true,
        "x-implementation-status": "implemented",
        "parameters": [{ "$ref": "#/components/parameters/DeviceOrigin" }],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DevicePairRequest" } } }
        },
        "responses": {
          "201": {
            "description": "Public device grant bound to this service and frontend origin.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceGrant" } } }
          },
          "400": { "$ref": "#/components/responses/DeviceBadRequest" },
          "401": { "$ref": "#/components/responses/DeviceUnauthorized" },
          "403": { "$ref": "#/components/responses/DeviceForbidden" },
          "409": { "description": "DEVICE_LIMIT_REACHED: the workspace already has 32 active devices." },
          "413": { "description": "Auth JSON exceeds 4096 bytes." },
          "503": { "$ref": "#/components/responses/DeviceUnavailable" }
        }
      }
    },
    "/api/v1/auth/challenges": {
      "post": {
        "operationId": "challengeLocalDevice",
        "summary": "Issue a short-lived proof challenge, not a business session.",
        "description": "No bearer required; strict Host, exact trusted Origin and a matching live device grant are still required. Challenge expires after 60 seconds and is held only in a bounded in-memory cache (256); restart discards it. Message is exactly seven newline-separated values: sociald-device-auth-v1, canonical service origin, frontend origin, device ID, challenge ID, nonce, RFC3339 UTC expiry. Client must reconstruct and validate it before signing.",
        "security": [],
        "x-implementation-status": "implemented",
        "parameters": [{ "$ref": "#/components/parameters/DeviceOrigin" }],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceChallengeRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Origin/service-bound one-use challenge.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceChallenge" } } }
          },
          "400": { "$ref": "#/components/responses/DeviceBadRequest" },
          "401": { "$ref": "#/components/responses/DeviceUnauthorized" },
          "403": { "$ref": "#/components/responses/DeviceForbidden" },
          "413": { "description": "Auth JSON exceeds 4096 bytes." },
          "429": { "$ref": "#/components/responses/DeviceBusy" },
          "503": { "$ref": "#/components/responses/DeviceUnavailable" }
        }
      }
    },
    "/api/v1/auth/sessions": {
      "post": {
        "operationId": "openLocalDeviceSession",
        "summary": "Exchange one ECDSA proof for a memory-only short-lived bearer.",
        "description": "No master bearer or cookie. Verify ECDSA P-256/SHA-256 over the exact challenge message with 64-byte P1363 r||s signature. A matching challenge is atomically consumed before verification, including failed signatures; it cannot be replayed. Grant is reloaded and checked. Access expires in at most 15 minutes, never after grant expiry; every business request reloads its grant so subsequent requests fail immediately after revocation. Device bearer cannot enroll another device.",
        "security": [],
        "x-implementation-status": "implemented",
        "parameters": [{ "$ref": "#/components/parameters/DeviceOrigin" }],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceSessionRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Bearer for this service/frontend only; retain in memory, never persist or log.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceSession" } } }
          },
          "400": { "$ref": "#/components/responses/DeviceBadRequest" },
          "401": { "$ref": "#/components/responses/DeviceUnauthorized" },
          "403": { "$ref": "#/components/responses/DeviceForbidden" },
          "413": { "description": "Auth JSON exceeds 4096 bytes." },
          "503": { "$ref": "#/components/responses/DeviceUnavailable" }
        }
      }
    },
    "/api/v1/auth/devices/{device_id}": {
      "delete": {
        "operationId": "revokeLocalDevice",
        "summary": "Revoke this device, or any device when using the master bearer.",
        "description": "Exact trusted Origin required. Master revocation is idempotent even for a missing ID; a device may revoke only itself and still must be currently authenticated. Deletes the persisted grant and pending challenges; already-authorized in-flight requests are not undone. Browser must also remove its local descriptor and CryptoKey, including offline, and report remote revocation as unconfirmed if unavailable.",
        "x-implementation-status": "implemented",
        "parameters": [
          { "$ref": "#/components/parameters/DeviceOrigin" },
          { "name": "device_id", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/DeviceID" } }
        ],
        "responses": {
          "204": { "description": "Grant removed; no response body." },
          "401": { "$ref": "#/components/responses/DeviceUnauthorized" },
          "403": { "$ref": "#/components/responses/DeviceForbidden" },
          "404": { "description": "Malformed or unknown authentication route." },
          "503": { "$ref": "#/components/responses/DeviceUnavailable" }
        }
      }
    },
