  "components": {
    "parameters": {
      "DeviceOrigin": {
        "name": "Origin",
        "in": "header",
        "required": true,
        "description": "Browser origin must match exactly. Missing, null, duplicate or mismatched origins are rejected; this is not cookie authentication.",
        "schema": {
          "type": "string",
          "enum": ["http://127.0.0.1:1420", "http://localhost:1420", "tauri://localhost", "http://tauri.localhost", "https://tauri.localhost"]
        }
      }
    },
    "responses": {
      "DeviceBadRequest": {
        "description": "AUTH_INVALID_REQUEST: invalid, duplicate, mis-cased or extra JSON fields, non-UTF8 input, invalid key or noncanonical URL/query.",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "DeviceUnauthorized": {
        "description": "Missing/invalid bearer, or unknown, expired, revoked, wrong-origin device or invalid/replayed proof. No secret is echoed.",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "DeviceForbidden": {
        "description": "Rejected Host/Origin/workspace, device attempted master-only pairing, or attempted to revoke another device.",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "DeviceBusy": {
        "description": "AUTH_BUSY: bounded challenge cache full. Keep the local key and retry later, not the original business mutation.",
        "headers": { "Retry-After": { "schema": { "type": "integer", "const": 60 } } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "DeviceUnavailable": {
        "description": "AUTH_UNAVAILABLE: encrypted storage/crypto unavailable, request canceled, or listener is not canonical 127.0.0.1. Only 127.0.0.1:<port> supports browser grants; other validated loopback listeners retain master-only API. A temporary 503 is not proof of revocation; retain the browser key for later recovery. Changing the actual listener address, including IP at the same port, or master token permanently prunes old grants at startup.",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      }
    },
    "securitySchemes": {
      "localBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Either the 32–4096 printable-ASCII master token (explicit SOCIALD_API_TOKEN or Windows protected launcher credential), or a short-lived origin-bound device access bearer. Only master can enroll devices. Device grants are reloaded for every business request; device bearers require their exact frontend Origin. No cookies or plaintext persistent browser master token."
      }
    },
    "schemas": {
      "DeviceID": {
        "type": "string",
        "minLength": 22,
        "maxLength": 22,
        "pattern": "^[A-Za-z0-9_-]{21}[AQgw]$",
        "description": "Canonical unpadded base64url encoding of 16 random bytes; not a bearer credential."
      },
      "DevicePairRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["public_key"],
        "properties": {
          "public_key": {
            "type": "string",
            "minLength": 122,
            "maxLength": 122,
            "pattern": "^[A-Za-z0-9_-]+$",
            "description": "Canonical unpadded base64url of 91-byte P-256 SPKI public key. Private key is nonextractable in browser IndexedDB and never sent."
          }
        }
      },
      "DeviceGrant": {
        "type": "object",
        "additionalProperties": false,
        "required": ["device_id", "expires_at", "service_origin", "frontend_origin"],
        "properties": {
          "device_id": { "$ref": "#/components/schemas/DeviceID" },
          "expires_at": { "type": "string", "format": "date-time", "description": "UTC expiry, at most 90 days after creation; not sliding." },
          "service_origin": { "type": "string", "pattern": "^http://127\\.0\\.0\\.1:[1-9][0-9]{0,4}$" },
          "frontend_origin": { "type": "string" }
        }
      },
      "DeviceChallengeRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["device_id"],
        "properties": { "device_id": { "$ref": "#/components/schemas/DeviceID" } }
      },
      "DeviceChallenge": {
        "type": "object",
        "additionalProperties": false,
        "required": ["challenge_id", "nonce", "expires_at", "message"],
        "properties": {
          "challenge_id": { "type": "string", "minLength": 43, "maxLength": 43, "pattern": "^[A-Za-z0-9_-]+$" },
          "nonce": { "type": "string", "minLength": 43, "maxLength": 43, "pattern": "^[A-Za-z0-9_-]+$" },
          "expires_at": { "type": "string", "format": "date-time" },
          "message": { "type": "string", "maxLength": 1024, "description": "Exact seven-line version/service/frontend/device/challenge/nonce/expiry message. Validate all fields and short expiry before signing; never sign arbitrary service text." }
        }
      },
      "DeviceSessionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["device_id", "challenge_id", "signature"],
        "properties": {
          "device_id": { "$ref": "#/components/schemas/DeviceID" },
          "challenge_id": { "type": "string", "minLength": 43, "maxLength": 43, "pattern": "^[A-Za-z0-9_-]+$" },
          "signature": { "type": "string", "minLength": 86, "maxLength": 86, "pattern": "^[A-Za-z0-9_-]+$", "description": "Canonical base64url of P1363 64-byte r||s, ECDSA P-256 SHA-256; ASN.1 DER signatures are not accepted." }
        }
      },
      "DeviceSession": {
        "type": "object",
        "additionalProperties": false,
        "required": ["access_token", "expires_at"],
        "properties": {
          "access_token": { "type": "string", "maxLength": 256, "description": "Opaque bearer, memory-only, at most 15 minutes. Never persist/log/use as React identity. Not the public device handle." },
          "expires_at": { "type": "string", "format": "date-time" }
        }
      },
      "PlannedEvent": {
        "type": "object",
        "description": "Design-only notification payload. No endpoint emits this schema yet. Events will reference resources instead of including chat bodies or credentials.",
        "required": [
          "id",
          "type",
          "occurred_at",
          "workspace_id",
          "resource_id",
          "resource_version"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "description": "Future persistent event cursor, assigned by the server."
          },
          "type": {
            "type": "string",
            "enum": [
              "message.updated",
              "connection.updated",
              "approval.updated",
              "job.updated",
              "report.updated"
            ]
          },
          "occurred_at": {
            "type": "string",
            "format": "date-time"
          },
          "workspace_id": {
            "type": "string"
          },
          "resource_id": {
            "type": "string"
          },
          "resource_version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message",
              "trace_id"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "trace_id": {
                "type": "string"
              }
            }
          }
        }
      },
      "Capabilities": {
        "type": "object",
        "required": [
          "receive_text",
          "send_text",
          "history_import"
        ],
        "properties": {
          "receive_text": {
            "type": "boolean",
            "description": "当前仅已配置邮箱且加密存储可用时提供手动只读收取；不表示持续监听。"
          },
          "send_text": {
            "type": "boolean",
            "const": false
          },
          "history_import": {
            "type": "boolean",
            "const": false
          }
        }
      },
      "Connector": {
        "type": "object",
        "required": [
          "id",
          "display_name",
          "platform",
          "status",
          "implementation_status",
          "capabilities",
          "description"
        ],
        "properties": {
          "id": {
            "type": "string",
            "enum": [
              "qq-milky",
              "weixin-clawbot",
              "telegram-bot",
              "email-imap",
              "wechat-db"
            ]
          },
          "display_name": {
            "type": "string"
          },
          "platform": {
            "type": "string",
            "enum": [
              "qq",
              "weixin",
              "telegram",
              "email"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "not_configured",
              "configured",
              "identity_verified",
              "unreachable",
              "auth_failed",
              "identity_mismatch",
              "logged_out",
              "protocol_error",
              "version_mismatch",
              "invalid_config",
              "runtime_not_configured",
              "verifying",
              "receiving",
              "closed",
              "canceled",
              "rate_limited",
              "webhook_present",
              "permission_denied",
              "platform_rejected",
              "unavailable"
            ]
          },
          "implementation_status": {
            "type": "string",
            "enum": [
              "planned",
              "probe_ready",
              "manual_sync_ready",
              "manual_read_ready",
              "manual_receive_ready"
            ]
          },
          "capabilities": {
            "$ref": "#/components/schemas/Capabilities"
          },
          "description": {
            "type": "string"
          }
        }
      },
      "System": {
        "type": "object",
        "required": [
          "version",
          "stage",
          "workspace_id",
          "automation",
          "storage",
          "connectors"
        ],
        "properties": {
          "version": {
            "type": "string"
          },
          "stage": {
            "type": "string",
            "enum": [
              "scaffold",
              "unified_inbox"
            ]
          },
          "workspace_id": {
            "type": "string",
            "const": "local-default"
          },
          "automation": {
            "type": "object",
            "required": [
              "paused",
              "auto_send_enabled"
            ],
            "properties": {
              "paused": {
                "type": "boolean",
                "const": true
              },
              "auto_send_enabled": {
                "type": "boolean",
                "const": false
              }
            }
          },
          "storage": {
            "type": "object",
            "required": [
              "configured",
              "driver"
            ],
            "properties": {
              "configured": {
                "type": "boolean"
              },
              "driver": {
                "type": "string",
                "enum": [
                  "sqlite",
                  "sqlcipher"
                ]
              }
            }
          },
          "connectors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Connector"
            }
          }
        }
      },
      "EmptyList": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 0,
            "items": {
              "type": "object"
            }
          },
          "next_cursor": {
            "type": "null"
          }
        }
      },
      "ConnectorList": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Connector"
            }
          },
          "next_cursor": {
            "type": "null"
          }
        },
        "description": "One personal QQ adapter with identity verification plus planned Weixin/Telegram adapters. Identity verification never enables messaging."
      },
      "OutboxState": {
        "type": "string",
        "enum": [
          "pending",
          "sending",
          "sent",
          "retry_wait",
          "failed",
          "unknown",
          "cancelled"
        ],
        "description": "Reserved domain state; no outbox persistence or send operation is implemented."
      },
