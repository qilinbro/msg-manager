        "description": "仅读本机加密配置与账本，不请求平台。仅返回AppID、密钥是否已配置、掩码本人接收者和非凭据绑定ID，不回显app_secret、完整open_id、access_token。保存与configured不证明平台可用或接收者确属本人：recipient_ownership_verified固定false；本人必须在专用表单自行声明并核对同应用open_id。 发送默认使用受限NoneBot子进程，不继承代理、不重定向、不重试；运行时缺失不会自动回退旧HTTP实现。"
